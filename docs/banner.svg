<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3fd6"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <filter id="cardsh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b1030" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="340" rx="22" fill="url(#hero)"/>
  <!-- soft decorative circles -->
  <circle cx="1140" cy="40" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="120" cy="330" r="180" fill="#ffffff" opacity="0.05"/>

  <!-- kicker -->
  <text x="56" y="80" font-size="15" letter-spacing="3" font-weight="700" fill="#ffffff" opacity="0.85">AWS SAMPLE  ·  AMAZON BEDROCK  ·  CLAUDE</text>

  <!-- title -->
  <text x="52" y="152" font-size="46" font-weight="800" fill="#ffffff">AML SAR Investigation Drafter</text>

  <!-- tagline -->
  <text x="56" y="196" font-size="19" fill="#ffffff" opacity="0.94">Claude reads the case, cites the evidence, and drafts the report.</text>
  <text x="56" y="224" font-size="19" font-weight="700" fill="#ffffff">You review and file.</text>

  <!-- pills -->
  <g font-size="13" font-weight="700">
    <rect x="56" y="256" width="196" height="34" rx="17" fill="#ffffff" opacity="0.16"/>
    <text x="74" y="278" fill="#ffffff">Human-in-the-loop</text>
    <rect x="264" y="256" width="214" height="34" rx="17" fill="#ffffff" opacity="0.16"/>
    <text x="282" y="278" fill="#ffffff">0 fabricated citations</text>
  </g>

  <!-- document + magnifier + verified motif -->
  <g filter="url(#cardsh)">
    <rect x="902" y="66" width="212" height="208" rx="16" fill="#ffffff"/>
  </g>
  <rect x="902" y="66" width="212" height="30" rx="16" fill="#d97757"/>
  <rect x="902" y="86" width="212" height="12" fill="#d97757"/>
  <g fill="#c7ccd8">
    <rect x="926" y="118" width="150" height="10" rx="5"/>
    <rect x="926" y="140" width="164" height="10" rx="5"/>
    <rect x="926" y="162" width="120" height="10" rx="5"/>
    <rect x="926" y="184" width="150" height="10" rx="5"/>
    <rect x="926" y="206" width="96" height="10" rx="5"/>
  </g>
  <!-- magnifier over the doc -->
  <circle cx="1064" cy="150" r="30" fill="none" stroke="#20b2aa" stroke-width="7"/>
  <line x1="1086" y1="172" x2="1108" y2="196" stroke="#20b2aa" stroke-width="8" stroke-linecap="round"/>
  <!-- verified check badge -->
  <circle cx="1096" cy="246" r="28" fill="#3ecf8e" stroke="#ffffff" stroke-width="4"/>
  <path d="M1084,246 l8,9 l16,-19" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
