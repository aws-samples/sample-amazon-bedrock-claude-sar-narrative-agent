[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-drafter"
version = "0.1.0"
description = "Claude-powered AML/SAR investigation narrative drafter (human-in-the-loop)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT-0" }
keywords = ["aml", "sar", "bedrock", "claude", "compliance", "agent"]

# Core runs offline with the mock provider and needs no dependencies.
dependencies = []

[project.optional-dependencies]
bedrock = ["boto3>=1.34.0"]
anthropic = ["anthropic>=0.39.0"]
dev = ["boto3>=1.34.0"]

[project.scripts]
sar-drafter = "sar_drafter.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
